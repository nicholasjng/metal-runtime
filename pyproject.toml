[project]
name = "metal-runtime"
dynamic = ["version"]
description = "Python bindings for Apple Metal"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/nicholasjng/metal-runtime"
Issues = "https://github.com/nicholasjng/metal-runtime/issues"

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/metal_runtime"]
cmake.version = ">=3.24"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/metal_runtime/__init__.py"

[dependency-groups]
build = [
    "nanobind>=2.13.0",
    "scikit-build-core>=0.10",
]
test = [
    "pytest>=8",
]
zed = [
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.uv]
# Build against the project .venv so includes from Python packages (nanobind
# etc.) in compile_commands.json survive across rebuilds -- same reasoning as mew.
no-build-isolation-package = ["metal-runtime"]
default-groups = ["build", "test", "zed"]

[tool.ruff]
extend-exclude = ["ext"]

[tool.ty.src]
include = ["src", "tests"]
