[project]
name = "metal-runtime"
dynamic = ["version"]
description = "Python bindings for Apple Metal"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/nicholasjng/metal-runtime"
Issues = "https://github.com/nicholasjng/metal-runtime/issues"

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/metal_runtime"]
cmake.version = ">=3.24"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/metal_runtime/__init__.py"

[dependency-groups]
bench = [
    "mew-bench",
]
build = [
    "nanobind>=2.13.0",
    "ruff>=0.16.0",  # for CMake's post-build stub formatting step.
    "scikit-build-core>=1.0",
]
test = [
    "pytest>=8",
    "ml-dtypes>=0.5", # to exercise the bfloat16 interop path, as NumPy can't represent that dtype.
]
typing = [
    "ty>=0.0.65",
]

[tool.uv]
# Build against the project .venv so includes from Python packages (nanobind
# etc.) in compile_commands.json survive across rebuilds.
no-build-isolation-package = ["metal-runtime"]
default-groups = ["bench", "build", "test", "typing"]

[tool.ruff]
extend-exclude = ["ext"]

[tool.ruff.lint.per-file-ignores]
"src/metal_runtime/_core.pyi" = ["C408"]  # stubgen outputs array metadata with a dict(...) call

[tool.ty.src]
include = ["src", "tests"]

[[tool.ty.overrides]]
# jax/mlx are stub-only annotations here (to_jax()/to_mlx()), not real deps of
# this package; neither is installed, so their imports are unresolved by design.
include = ["src/metal_runtime/_core.pyi"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
